[project]
name = "voicelab"
version = "0.1.0"
description = "Bakes the two recorded voices into the six voice slots the client plays."
requires-python = ">=3.11"
dependencies = [
    "pocket-tts",
    "librosa",
    "soundfile",
    "numpy",
    "scipy",
    "piper-tts>=1.7.0",
    "nara-wpe>=0.0.11",
]

[project.scripts]
voicelab = "voicelab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicelab"]
